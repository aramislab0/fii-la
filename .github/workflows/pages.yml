name: Mettre Fii La en production

# À chaque envoi sur main : 0) tous les tests sur une base de test (rien ne part si un test échoue), 1) migrations de la base,
# 2) mise en ligne du site, 3) tests en production. Seul secret : SUPABASE_DB_PASSWORD (réglages du dépôt > Secrets).
# Sans ce secret : publication seulement si la base en ligne est déjà au moins à la version du dépôt.

on:
  push:
    branches: [main]
    paths: ['web/**', 'supabase/migrations/**', 'scripts/**', 'tests/**', 'package*.json', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false   # ne jamais couper une migration en cours

defaults:
  run:
    shell: bash   # bash -eo pipefail : un test qui échoue dans une boucle ou un tube fait échouer l'étape

env:
  # Adresse du serveur de la base, sans mot de passe (non secrète).
  SUPABASE_POOLER_URL: postgresql://postgres.lkvulwocirttozfnyxck@aws-1-eu-west-3.pooler.supabase.com:5432/postgres
  SITE_URL: https://aramislab0.github.io/fii-la/

jobs:
  test:
    name: 0. Tests (base de test)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Suites SQL
        run: scripts/run-suites.sh sql
      - name: Suites navigateur (Chrome)
        if: always()
        run: scripts/run-suites.sh browser
      - name: Captures en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with: { name: 'tests-${{ github.sha }}', path: docs/screenshots/, retention-days: 7 }

  migrate:
    name: 1. Base de données
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - name: Secret présent ? Sinon, la base en ligne doit déjà être à jour
        id: s
        env:
          PW: '${{ secrets.SUPABASE_DB_PASSWORD }}'
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -n "$PW" ]; then echo "ok=1" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "ok=0" >> "$GITHUB_OUTPUT"
          # Garde-fou : sans le secret, on ne publie que si la base en ligne a déjà (au moins) la dernière migration du dépôt
          # (sinon le site appellerait des fonctions absentes). « Au moins » : republier une version antérieure reste possible.
          latest=$(ls supabase/migrations/*.sql | sed 's#.*/##' | cut -c1-14 | sort | tail -1)
          auth=(); case "$SUPABASE_KEY" in eyJ*) auth=(-H "Authorization: Bearer $SUPABASE_KEY");; esac   # comme l'application
          got=$(curl -fsS -X POST "$SUPABASE_URL/rest/v1/rpc/fiila_schema_version" -H "apikey: $SUPABASE_KEY" "${auth[@]}" \
                -H 'Content-Type: application/json' -d '{}' 2>/dev/null | tr -d '"' || true)
          if [ -z "$got" ] || [[ "$got" < "$latest" ]]; then
            echo "::error::Base en ligne en retard (version ${got:-inconnue}, attendue $latest) et SUPABASE_DB_PASSWORD absent : mise en ligne bloquée. Enregistrer le secret (action #41) puis relancer."
            exit 1
          fi
          echo "::warning::SUPABASE_DB_PASSWORD absent, mais la base est déjà à jour ($got ≥ $latest) : mise en ligne autorisée."
      - if: steps.s.outputs.ok == '1'
        run: npm ci --ignore-scripts
      - name: Appliquer les migrations (chacune une seule fois, en transaction)
        if: steps.s.outputs.ok == '1'
        env: { SUPABASE_DB_PASSWORD: '${{ secrets.SUPABASE_DB_PASSWORD }}' }
        run: for f in supabase/migrations/*.sql; do node scripts/apply-migration.mjs "$f"; done
      - name: Vérifier la base (fonctions, droits du rôle public)
        if: steps.s.outputs.ok == '1'
        env: { SUPABASE_DB_PASSWORD: '${{ secrets.SUPABASE_DB_PASSWORD }}' }
        run: |
          export DATABASE_URL=$(node -e 'const u=new URL(process.env.SUPABASE_POOLER_URL);u.password=encodeURIComponent(process.env.SUPABASE_DB_PASSWORD);process.stdout.write(u.toString())')
          echo "::add-mask::$DATABASE_URL"
          node scripts/verify-db.mjs

  deploy:
    name: 2. Mise en ligne
    needs: migrate
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Écrire la configuration publique
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
          PUBLIC_URL: ${{ vars.PUBLIC_URL }}
          FACEBOOK_APP_ID: ${{ vars.FACEBOOK_APP_ID }}
        run: |
          test -n "$SUPABASE_URL" || { echo "Variable SUPABASE_URL manquante"; exit 1; }
          test -n "$SUPABASE_KEY" || { echo "Variable SUPABASE_PUBLISHABLE_KEY manquante"; exit 1; }
          node -e 'const c={supabaseUrl:process.env.SUPABASE_URL,supabaseKey:process.env.SUPABASE_KEY,publicUrl:process.env.PUBLIC_URL||"",facebookAppId:process.env.FACEBOOK_APP_ID||""};require("fs").writeFileSync("web/config.js","window.FIILA_CONFIG="+JSON.stringify(c)+";\n")'
          echo "<!-- build ${GITHUB_SHA} -->" >> web/index.html
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --ignore-scripts
      - name: Compresser le code (app.js, styles.css, theme.js)
        run: node scripts/minify.mjs web
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4

  verify:
    name: 3. Tests en production (Chrome + Safari)
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium webkit
      - name: Attendre que le site en ligne serve cette version
        run: |
          for i in $(seq 1 60); do
            curl -fsS "$SITE_URL?v=$RANDOM" | grep -q "build ${GITHUB_SHA}" && { echo "Version en ligne : ${GITHUB_SHA}"; exit 0; }
            sleep 10
          done
          echo "::error::Le site ne sert pas encore cette version après 10 minutes."; exit 1
      - name: Contrôles en lecture seule de la base en ligne (fil, back-office, version)
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          auth=(); case "$SUPABASE_KEY" in eyJ*) auth=(-H "Authorization: Bearer $SUPABASE_KEY");; esac
          rpc() { curl -fsS -X POST "$SUPABASE_URL/rest/v1/rpc/$1" -H "apikey: $SUPABASE_KEY" "${auth[@]}" -H 'Content-Type: application/json' -d "$2"; }
          rpc fiila_posts '{}' | grep -q '"posts"'                      || { echo "::error::fiila_posts ne répond pas"; exit 1; }
          rpc fiila_bo_me '{}' | grep -q '"staff": *false'              || { echo "::error::fiila_bo_me doit refuser un visiteur"; exit 1; }
          latest=$(ls supabase/migrations/*.sql | sed 's#.*/##' | cut -c1-14 | sort | tail -1)
          [ "$(rpc fiila_schema_version '{}' | tr -d '"')" \> "$latest" ] || [ "$(rpc fiila_schema_version '{}' | tr -d '"')" = "$latest" ] \
            || { echo "::error::version de la base en retard"; exit 1; }
          echo "Base en ligne : fil, portail du back-office et version vérifiés."
      - name: Parcours complet sur le site en ligne — Chrome
        run: FIILA_URL=$SITE_URL SHOTS=/tmp/prod-c node tests/e2e.test.mjs
      - name: Parcours complet sur le site en ligne — Safari (WebKit)
        if: always()
        run: FIILA_URL=$SITE_URL ENGINE=webkit SHOTS=/tmp/prod-w node tests/e2e.test.mjs
      - name: Écrans clés — Safari (WebKit, base de test locale)
        if: always()
        run: ENGINE=webkit scripts/run-suites.sh list referrals shop vitrine products videdressing navigation feed ambassadors engage backoffice team photos nudges onboarding shopsetup aftertask partners wacards media
      - name: Captures et rapports en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: preuves-${{ github.sha }}
          path: |
            docs/screenshots/
            docs/*.json
            /tmp/prod-c
            /tmp/prod-w
          retention-days: 7
