name: Vérifier une branche (sans mise en ligne)

# Toute branche autre que main : base de test locale, suites SQL, puis les écrans clés sur Chrome et Safari (WebKit).
# Rien n'est mis en ligne et aucun secret n'est utilisé.

on:
  push:
    branches-ignore: [main]

permissions:
  contents: read

defaults:
  run:
    shell: bash   # bash -eo pipefail : sans lui, « node … | tail -1 » ne pouvait jamais échouer (audit 19/10)

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium webkit
      - name: Suites SQL
        run: scripts/run-suites.sh sql
      - name: Écrans clés — Safari (WebKit)
        if: always()
        run: ENGINE=webkit scripts/run-suites.sh list backoffice engage feed products vitrine videdressing navigation shop team
      - name: Captures en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: preuves-${{ github.sha }}
          path: docs/screenshots/
          retention-days: 7
